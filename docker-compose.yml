services:
  # Main automation app service
  app-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: americano-app
    volumes:
      - ./config.json:/app/config.json
      - ./targets:/app/targets
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py --config config.json run
    networks:
      - americano-network
    restart: unless-stopped

  # UI server service
  ui-server:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: americano-ui
    ports:
      - "5000:5000"
    volumes:
      - ./config.json:/app/config.json
      - ./targets:/app/targets
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    depends_on:
      - app-service
    networks:
      - americano-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  americano-network:
    driver: bridge
