<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Americano simple</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .simple-wrap { max-width: 560px; margin: 48px auto; padding: 0 20px; }
    .simple-card { background: #fff; border: 1px solid #e5ddcf; border-radius: 16px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .simple-card h1 { font-size: 22px; margin: 0 0 4px; }
    .simple-sub { color: #8a7f6d; margin: 0 0 20px; }
    .simple-label { display: block; font-weight: 700; margin: 16px 0 6px; }
    .simple-select, .simple-btn { font-size: 17px; }
    .simple-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d8cfbd; }
    .simple-target { color: #6b6252; min-height: 22px; margin: 6px 0 0; }
    .simple-status-row { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
    .status-pill { padding: 6px 14px; border-radius: 999px; background: #eee8da; font-weight: 700; }
    .status-pill.running { background: #dcfce7; }
    .status-pill.error { background: #fee2e2; }
    .simple-progress { color: #6b6252; }
    .simple-actions { display: flex; gap: 12px; margin-top: 8px; }
    .simple-actions .button { flex: 1; padding: 16px; font-size: 19px; border-radius: 12px; }
    .error-box { margin-top: 20px; border: 1px solid #f0b4b4; background: #fef2f2; border-radius: 12px; padding: 16px; }
    .error-code { font-weight: 700; }
    .admin-row { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; }
    .admin-link { background: none; border: none; color: #a39e93; text-decoration: underline; cursor: pointer; font-size: 13px; }
    .admin-detail { margin-top: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-all; background: #faf7f1; border: 1px solid #e5ddcf; border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <main class="simple-wrap">
    <section class="simple-card" aria-label="간편 실행">
      <p class="eyebrow">AMERICANO SIMPLE</p>
      <h1>매크로 실행</h1>
      <p class="simple-sub">매크로를 고르고 시작만 누르세요.</p>

      <label class="simple-label" for="macro-select">매크로 선택</label>
      <select id="macro-select" class="simple-select" aria-label="매크로 선택"></select>
      <p id="target-info" class="simple-target"></p>

      <div class="simple-status-row">
        <span id="status-pill" class="status-pill" role="status">대기중</span>
        <span id="progress-line" class="simple-progress">실행 대기</span>
      </div>

      <div class="simple-actions">
        <button id="start-button" class="button primary simple-btn">시작</button>
        <button id="stop-button" class="button danger simple-btn" disabled>중지</button>
      </div>

      <div id="error-box" class="error-box" hidden>
        <div>문제가 발생했습니다. <strong>관리자에게 문의하세요.</strong></div>
        <div style="margin-top:8px"><span class="error-code" id="error-code"></span> <span id="error-time"></span></div>
        <div style="margin-top:10px; display:flex; gap:8px">
          <button id="error-copy" class="button ghost">에러코드 복사</button>
          <button id="error-detail-toggle" class="button ghost">관리자용 상세</button>
        </div>
        <div id="error-detail" class="admin-detail" hidden></div>
      </div>

      <div class="admin-row">
        <span id="license-line" class="simple-progress">라이선스 확인 중</span>
        <span style="display:flex; gap:8px; align-items:center">
          <span id="license-status" class="status-pill">확인 중</span>
          <button id="license-register" class="button ghost">라이선스 등록</button>
          <button id="admin-open" class="admin-link">관리자</button>
        </span>
      </div>
    </section>
  </main>
  <script src="simple.js"></script>
</body>
</html>
