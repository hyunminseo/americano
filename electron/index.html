<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Americano</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><p class="eyebrow">MACRO WORKSPACE</p><h1>Americano</h1></div><strong id="status-label" role="status">준비 중</strong></header>
    <p id="availability" class="notice"></p>
    <section class="toolbar"><span id="runtime-copy">실행 대기</span><div class="actions"><button class="button ghost" id="pause-button">F8 일시정지</button><button class="button danger" id="stop-button">F9 중지</button></div></section>
    <div class="workspace">
      <aside><div class="section-heading"><h3>매크로</h3><button id="new-button" class="button ghost">새로 만들기</button></div><div id="macros"></div></aside>
      <section id="editor"><p>매크로를 만들거나 선택하세요.</p></section>
    </div>
    <footer><span id="log-line" role="status" aria-live="polite">로컬 암호화 저장소 준비 중</span></footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
