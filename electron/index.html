<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Americano</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><p class="eyebrow">MACRO WORKSPACE</p><h1>Americano</h1><p class="topbar-subtitle">Windows 자동화 흐름을 설계하고 안전하게 미리보세요.</p></div><div class="topbar-actions"><strong id="status-label" role="status">준비 중</strong><button id="license-open" class="license-trigger" aria-haspopup="dialog" aria-controls="license-dialog"><span>◆</span> 라이선스</button></div></header>
    <p id="availability" class="notice"></p>
    <section class="overview-grid" aria-label="작업 공간 요약"><div class="metric"><span>등록된 매크로</span><strong id="macro-count">0</strong><small>로컬 암호화 저장소</small></div><div class="metric"><span>전체 단계</span><strong id="step-count">0</strong><small>반복 내부 단계 포함</small></div><div class="metric"><span>현재 라이선스</span><strong id="license-summary">확인 중</strong><small id="license-summary-detail">실행 권한 상태</small></div></section>
    <section class="toolbar"><span id="runtime-copy">실행 대기</span><div class="actions"><button class="button ghost" id="pause-button">F8 일시정지</button><button class="button danger" id="stop-button">F9 중지</button></div></section>
    <div class="workspace">
      <aside><div class="section-heading"><h3>매크로</h3><button id="new-button" class="button ghost">새로 만들기</button></div><label class="search-box"><span>⌕</span><input id="macro-search" type="search" placeholder="매크로 검색" aria-label="매크로 검색"></label><div id="macros"></div></aside>
      <section id="editor"><p>매크로를 만들거나 선택하세요.</p></section>
    </div>
    <footer><span id="log-line" role="status" aria-live="polite">로컬 암호화 저장소 준비 중</span></footer>
  </main>
  <div id="license-dialog" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="license-dialog-title" hidden>
    <section class="license-modal"><div class="modal-heading"><div><p class="eyebrow">OFFLINE LICENSE</p><h2 id="license-dialog-title">라이선스 관리</h2></div><button id="license-close" class="icon-button" aria-label="라이선스 창 닫기">×</button></div>
      <div class="license-status-card"><span class="license-orb">◆</span><div><strong id="license-status" role="status">라이선스 확인 중</strong><p id="license-detail"></p><p id="license-device"></p></div></div>
      <div class="modal-actions"><button id="license-import" class="button primary">라이선스 파일 등록</button><button id="license-check" class="button ghost">실행 권한 확인</button><button id="license-device-button" class="button ghost">이 PC의 MAC 확인</button></div>
      <p class="modal-note">라이선스 파일은 앱 내부의 암호화 저장소에 등록되며 외부로 전송되지 않습니다.</p>
    </section>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
